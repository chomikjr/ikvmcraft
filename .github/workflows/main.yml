name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ikvmcraft 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          pnpm config set store-dir ~/.pnpm-store
          cd frontend && pnpm install

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install mono
        run: sudo apt-get install mono-devel

      - name: Build Csproj
        run: |
          cd loader && dotnet workload restore && cd ..
          make publish AOT=true OPT=false

      - uses: actions/upload-artifact@v4
        with:
          name: ikvmcraft
          path: frontend/dist/
          compression-level: 6
  deploy:
    name: Publish the build to the deploy branch (Vercel serves it)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Get artifact
        uses: actions/download-artifact@v4
        with:
          name: ikvmcraft
          path: dist/

      - name: Add Vercel headers
        run: |
          cat > dist/vercel.json <<'JSON'
          { "headers": [{ "source": "/(.*)", "headers": [
            { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" },
            { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" },
            { "key": "Cross-Origin-Resource-Policy", "value": "cross-origin" },
            { "key": "Content-Security-Policy", "value": "frame-ancestors 'self' https://nova.delsea.one https://*.vercel.app" } ] }] }
          JSON

      - name: Push to deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
